# Cloudflare Pages configuration for the "Ask the HQ" Function (functions/api/ask.ts).
#
# `wrangler pages deploy out` (run from the repo root) reads this file because it sets
# `pages_build_output_dir`. It then becomes the source of truth for the project's bindings and
# variables: the same fields can no longer be edited in the dashboard, and a deploy overwrites them.
# Runbook (provisioning, deploy, kill switch, rotation): docs/ask-runbook.md.
#
# Secrets never live here. Set them with `bunx wrangler@4 pages secret put <NAME> --project-name=kurniadi`:
#   TURNSTILE_SECRET  Turnstile widget secret (siteverify)
#   ASK_IP_SALT_SEED  seed of the daily-rotating salt for visitor IP hashes (rate limits)
#   ASK_COOKIE_KEY    HMAC key of the 30-minute signed Turnstile session cookie
#   GROQ_API_KEY      Groq API key of the backup tiers (optional; without it Groq is skipped)

name = "kurniadi"
pages_build_output_dir = "out"
compatibility_date = "2026-10-01"

# Workers AI. The Function routes every model call through the AI Gateway named in ASK_GATEWAY_ID
# (cache, logs and the global rate limit live there).
[ai]
binding = "AI"

# KV namespace "shinyq-hq-ask": answer cache (`ans:` keys, 7-day TTL), rate-limit counters and the
# circuit-breaker flag. KV namespace IDs are not secret; `bun scripts/provision-ask.ts --apply`
# writes this one (it fails a deploy if it ever points at a missing namespace).
[[kv_namespaces]]
binding = "ASK_KV"
id = "52fa119d49f641078dbecbb12aad4ccb"

# Workers Analytics Engine dataset for anonymized ask events (no IP, no raw text):
# blobs [outcome, locale, source, scrubbedQuestionOrEmpty, packVersion, reason, entry, topic, chip,
# model (id of the answering model), failureTrail ("model:reason > ..." of the tiers that failed first)],
# doubles [latencyMs, 1]. topic (blob8) and chip (blob9) feed the public visit stats (workers/stats/).
# The dataset is created on the first write; scripts/content-gap.ts reads it through the SQL API.
[[analytics_engine_datasets]]
binding = "ASK_EVENTS"
dataset = "ask_events"

# Workers Analytics Engine dataset for the anonymous performance beacon (functions/api/rum.ts,
# appendix 06 section 4): one point per sampled 3D session, no IP, no user agent, coarse buckets only.
# blobs [version, tier, path, fps50, fps10, explore], doubles [contextLost, bootTimeout, 1], index tier.
# Created on the first write; query it with the Analytics Engine SQL API (docs/deploy.md section 12).
[[analytics_engine_datasets]]
binding = "PERF_EVENTS"
dataset = "perf_events"

# Workers Analytics Engine dataset of the public visit stats beacon (functions/api/visit.ts, appendix 06
# section 4): one point per page lifetime, no IP, no user agent, no URL. blobs [version, mode (3d, classic,
# both)], doubles [1], index the constant "visit". Created on the first write; read by the hq-stats Worker.
[[analytics_engine_datasets]]
binding = "VISIT_EVENTS"
dataset = "visit_events"

# KV namespace "STATS_KV": the public visit stats snapshot (`stats:v1`) and the ledger of finalized days
# (`stats:days:v1`), written by the hq-stats Cron Worker every 2 hours (workers/stats/wrangler.toml binds
# the same id) and read by GET /api/stats. KV namespace IDs are not secret.
[[kv_namespaces]]
binding = "STATS_KV"
id = "88fb27f910f44e6393b8fd495d6a2c4f"

# R2 bucket "hq-study-guides" (private, no r2.dev URL): the study guide PDFs served by /api/guides/<slug>
# (functions/api/guides/[slug].ts). Keys are <slug>/<version>.pdf; upload with scripts/study-guides.ts
# (docs/study-guides-runbook.md).
[[r2_buckets]]
binding = "GUIDES"
bucket_name = "hq-study-guides"

# Optional Workers rate limiting binding (8 requests per 60 s per visitor hash). Pages support is
# still rolling out, so it stays off; the Function falls back to its in-memory and KV limiters.
# Uncomment once `wrangler pages deploy` accepts it.
# [[ratelimits]]
# name = "ASK_RL"
# namespace_id = "1001"
# simple = { limit = 8, period = 60 }

# Agent Office (docs/agents/office.md, runbook workers/office/README.md): the hq-office Worker behind GET /api/office,
# POST /api/office/beat and POST /api/office/github. Calls through a service binding add no request charge.
# Pages rejects a deploy whose service binding names a missing Worker, so deploy.yml deploys hq-office inside the
# Pages job, after the gates and before the upload.
[[services]]
binding = "OFFICE"
service = "hq-office"

[vars]
# Kill switch. Anything but "true" hides the UI and makes /api/ask return 503 (docs/ask-runbook.md).
# Turned on for the first production deploy on 2026-10-11 (owner approval).
ASK_ENABLED = "true"
# Primary and fallback Workers AI models (one fallback attempt per question).
ASK_PRIMARY = "@cf/google/gemma-4-26b-a4b-it"
ASK_FALLBACK = "@cf/mistralai/mistral-small-3.1-24b-instruct"
# Groq backup models, tried in order after the Workers AI models (needs the GROQ_API_KEY secret).
ASK_BACKUP_MODELS = "qwen/qwen3.8-27b,openai/gpt-oss-120b"
# AI Gateway ID (cache TTL 7 days, logs on, 600 requests per day). Its Workers AI billing mode is
# "postpaid": calls count against the account's own Workers AI quota (10k free neurons per day).
ASK_GATEWAY_ID = "shinyq-hq"
# Public Turnstile site key of the invisible widget "shinyq-hq-ask" (kurniadi.pages.dev,
# kurniadi.dev), written by scripts/provision-ask.ts. Empty means Turnstile is off.
TURNSTILE_SITE_KEY = "0x4AAAAAAFTVgnlNQl3EZH4k"
# Allowed Origin values, comma separated; `https://*.example.dev` matches one subdomain label.
# Previews are not listed: they get no production secrets, so the Function stays off there
# (a Turnstile site key without its secret fails closed).
ASK_ALLOWED_ORIGINS = "https://kurniadi.pages.dev,https://kurniadi.dev"
# Global model calls per day (second layer under the AI Gateway rate limit).
ASK_DAILY_CAP = "600"
# Kill switch of the performance beacon (/api/rum). Anything but "true" drops every point (204).
# On since round 5 (owner approval 2026-10-13).
RUM_ENABLED = "true"
# Kill switch of the public visit stats (/api/visit and /api/stats). Anything but "true" drops visit points
# (204) and makes /api/stats answer 204, which hides every stats view. On since the S1 pipeline (owner
# approval 2026-10-14).
STATS_ENABLED = "true"
# Kill switch of the Agent Office. Anything but "true" makes GET /api/office answer {"v":1,"enabled":false} (the 3D
# office and the Classic card hide) and drops beats and webhooks (204). On since part 1 (owner pre-approval 2026-10-18).
OFFICE_ENABLED = "true"
