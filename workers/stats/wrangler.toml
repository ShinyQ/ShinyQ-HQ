# hq-stats: the public visit stats Cron Worker (runbook: workers/stats/README.md).
#
# Deployed by .github/workflows/deploy.yml (cloudflare/wrangler-action) from this folder; it has its own
# config, separate from the Pages project in the repo root. No route, no workers.dev or preview URL, so nothing on
# it is reachable from the internet: its fetch handler (GET /live, the live visit count) answers only the Pages
# project's STATS service binding (wrangler.toml in the repo root).
#
# Secrets never live here. deploy.yml sets them from GitHub secrets on every deploy:
#   WA_TOKEN       read-only Account Analytics token (GitHub secret CF_EVAL_TOKEN)
#   WA_ACCOUNT_ID  Cloudflare account id (GitHub secret CLOUDFLARE_ACCOUNT_ID; kept out of the public repo)

name = "hq-stats"
main = "src/index.ts"
compatibility_date = "2026-10-19"
workers_dev = false
preview_urls = false

# Every hour (UTC), 17 minutes past the hour (owner decision 2026-10-24; was every 2 hours): finalizes days an
# hour after they end and refreshes the snapshot with today so far. Off the top of the hour on purpose: the 04:00 and 12:00 runs of 2026-10-16 got a coarsely
# sampled Web Analytics answer while a run at 12:15 got the exact one (README, "Finalized and provisional days").
[triggers]
crons = ["17 * * * *"]

# Same namespace as the Pages project's STATS_KV binding (wrangler.toml in the repo root): the ledger
# `stats:days:v1`, the public snapshot `stats:v1` and its live tail `stats:live:v1`. KV namespace IDs are not secret.
[[kv_namespaces]]
binding = "STATS_KV"
id = "88fb27f910f44e6393b8fd495d6a2c4f"

# The single LiveGate Durable Object (src/live.ts): every live visit count of GET /api/stats goes through it, so the
# Analytics Engine query runs at most once a minute across every data center (about 1,440 a day). SQLite-backed, so
# it runs on the free plan (like hq-office's Office).
[[durable_objects.bindings]]
name = "LIVE_GATE"
class_name = "LiveGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveGate"]

[vars]
# Web Analytics site of the production site (not the public beacon token; useless without an API token).
WA_SITE_TAG = "4134db56168b4eb58d19fc1ead78b131"
# Production hosts only: local dev and e2e traffic (127.0.0.1) and previews share the siteTag.
WA_HOSTS = "kurniadi.pages.dev,kurniadi.dev"

[observability]
enabled = true
