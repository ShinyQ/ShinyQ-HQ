# Weekly dependency updates (T12). Grouped to keep the PR count low; majors stay separate.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # revisit 2027-01-15: typescript-eslint 8 supports TypeScript below 6.1 and TypeScript 7 drops the compiler API tests use
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # revisit 2027-01-15: 0.53.x FontResolver reads only the first user font, so symbol glyphs hit the CSP-blocked CDN (docs/agents/ci-and-deploy.md, Dependencies)
      - dependency-name: "troika-three-text"
        versions: [">=0.53.0"]
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    groups:
      actions:
        patterns: ["*"]
