name: Deploy

# Production deploy of the static export to Cloudflare Pages.
# Nothing deploys until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# secrets and the CF_PAGES_PROJECT repository variable are all set.
# The Pages project's production branch must be `main`, otherwise the
# `--branch=main` deploy below is published as a preview. See docs/deploy.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  SAFETY_BLOCKLIST: ${{ secrets.SAFETY_BLOCKLIST }}
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}

jobs:
  site:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Set site URL
        # Only export NEXT_PUBLIC_SITE_URL when the variable is set, so the
        # default in src/lib/site.ts applies otherwise.
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$SITE_URL" ]; then
            echo "NEXT_PUBLIC_SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
          fi
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'content/**', 'messages/**', 'public/**', 'next.config.ts') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      - name: Build static export
        run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: site-production
          path: out/
          retention-days: 30

  e2e:
    # The same sharded suite as CI, against the exact files that get deployed.
    name: E2E shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    needs: site
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: "true"
      - uses: actions/download-artifact@v8
        with:
          name: site-production
          path: out
      - name: Playwright e2e (shard ${{ matrix.shard }}/4)
        run: bun run e2e:shard ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: blob-report-deploy-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  deploy:
    name: Cloudflare Pages production
    runs-on: ubuntu-latest
    needs: [site, e2e]
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://kurniadi.pages.dev' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
    steps:
      - name: Check deploy configuration
        id: gate
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CF_PAGES_PROJECT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID or the CF_PAGES_PROJECT variable is not set; skipping the production deploy."
          fi
      - uses: actions/download-artifact@v8
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: site-production
          path: out
      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.enabled == 'true'
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.gate.outputs.enabled == 'true'
        run: |
          bunx wrangler@3 pages deploy out --project-name="$CF_PAGES_PROJECT" --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true | tee deploy.log
          URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -n1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: steps.gate.outputs.enabled == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://kurniadi.pages.dev' }}
        run: |
          {
            echo "Deployed ${{ github.sha }} to Cloudflare Pages project \`$CF_PAGES_PROJECT\`."
            echo ""
            echo "- Deployment: ${{ steps.deploy.outputs.url }}"
            echo "- Production: $SITE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
