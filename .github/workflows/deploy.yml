name: Deploy

# Production deploy of the static export and the Pages Functions (Ask the HQ, the performance beacon,
# the public visit stats) to Cloudflare Pages, with the hq-office Agent Office Worker (workers/office/) deployed in
# the same job just before the upload, then the hq-stats Cron Worker (workers/stats/).
#
# Runs on a push to main (a merge) and when dispatched:
#   - push: the fast path (owner decision 2026-10-18). scripts/merge-gate.ts deploys at once, without waiting
#     for the push CI on main, when the commit is the merge of a same-repository pull request whose head has the
#     same tree and whose required checks were green there, and no `deploy-rollback` issue is open. Otherwise it
#     falls back to waiting for the complete main CI as below. Main CI runs the complement of the PR run (or the
#     full suite) in parallel; when it fails, rollback.yml rolls production back and opens the `deploy-rollback`
#     issue, which blocks the fast path until main is green again. A GITHUB_TOKEN merge (the weekly facts PR)
#     starts no push run.
#   - by refresh-facts.yml after it merged a weekly live-facts PR (sha = the merge commit), unless
#     the repository variable AUTO_DEPLOY_FACTS is "false";
#   - by hand: Actions > Deploy > Run workflow, or `gh workflow run deploy.yml --ref main [-f sha=<commit>]`.
# The sha must be on main. Outside the fast path the deploy does not rerun e2e on a tested commit: `Reuse the CI
# result` (scripts/ci-status.ts) waits for CI's `Build, CV and e2e` check on the sha, or finds a green CI run on
# a commit with the same tree (a push to main or a same-repository PR run only; the facts merge finds
# none, since its PR was tested by a workflow_dispatch run, so it runs the e2e shards). Only complete runs are
# reused: those with the `ci-full` artifact (every e2e shard, the perf gates and Lighthouse ran); a
# selective PR run never is, and older runs without the marker are not reused. A red CI fails the deploy.
# Only without a complete CI result, or with the `rerun_e2e` input, does it build without the analytics beacon
# and run the 8 e2e shards itself. It deploys the production build (with the beacon) with
# --branch=main, smoke-checks production (scripts/deploy-smoke.ts) and opens a `deploy-failed` issue on
# failure. Needs the CLOUDFLARE_API_TOKEN (Pages Edit; Workers Scripts Edit for the hq-stats and hq-office Workers,
# accepted by owner decision 4 because it lives only in the main-only `production` environment) and
# CLOUDFLARE_ACCOUNT_ID secrets and the CF_PAGES_PROJECT variable; skips the upload with a notice while
# any is missing. The Worker job also needs an Account Analytics Read token for the Worker's WA_TOKEN:
# CF_STATS_TOKEN (analytics only, 90-day expiry), falling back to CF_EVAL_TOKEN until it exists.
# Secrets are passed only to the steps that read them (H1). docs/deploy.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to deploy (default the tip of main)
        required: false
        type: string
      reason:
        description: Why (shown in the run summary)
        required: false
        type: string
      rerun_e2e:
        description: Run the e2e shards here even when CI already passed on this commit
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://kurniadi.pages.dev' }}

jobs:
  resolve:
    name: Resolve commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
      - name: Check the commit is on main
        id: sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
          # A push deploys the pushed commit, even if main moved on while this run waited in the queue.
          PUSH_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
          REASON: ${{ github.event_name == 'push' && 'Merge to main (push)' || inputs.reason }}
        run: |
          sha="${INPUT_SHA:-${PUSH_SHA:-$(git rev-parse HEAD)}}"
          if ! [[ "$sha" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::sha must be a commit hash."
            exit 1
          fi
          sha=$(git rev-parse --verify "$sha^{commit}")
          if ! git merge-base --is-ancestor "$sha" HEAD; then
            echo "::error::$sha is not on main; only main commits deploy to production."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying \`$sha\` ($(git log -1 --format=%s "$sha"))." >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$REASON" ]; then printf '\nReason: %s\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"; fi

  verify:
    name: Reuse the CI result
    runs-on: ubuntu-latest
    needs: resolve
    permissions:
      contents: read
      checks: read
      actions: read
      issues: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.fast.outputs.fast == 'true' || steps.ci.outputs.reuse == 'true' }}
      fast: ${{ steps.fast.outputs.fast == 'true' }}
      pr: ${{ steps.fast.outputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Fast path (merged PR green on the same tree)
        id: fast
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: bun scripts/merge-gate.ts --repo "$REPO" --sha "$SHA"
      - name: Green CI on this commit (waits while CI runs)
        id: ci
        if: steps.fast.outputs.fast != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve.outputs.sha }}
          RERUN_E2E: ${{ inputs.rerun_e2e }}
        run: bun scripts/ci-status.ts --repo "$REPO" --sha "$SHA" --wait-minutes 40 --grace-minutes 3 --force-rerun "$RERUN_E2E"

  site:
    name: Build static export
    runs-on: ubuntu-latest
    needs: [resolve, verify]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}
          # The knowledge pack date comes from the last commit that touched content/.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # Refresh the /build numbers (git history, test counts, CI jobs, budgets) for the shipped build.
      - name: Build facts snapshot
        run: bun scripts/build-facts.ts --write
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'content/**', 'messages/**', 'public/**', 'next.config.ts') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      - name: Build for the e2e shards (no analytics beacon)
        if: needs.verify.outputs.reuse != 'true'
        run: bun run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.verify.outputs.reuse != 'true'
        with:
          name: site-test
          path: out/
          retention-days: 3
      - name: Build for production (with the analytics beacon and search engine verification)
        env:
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
          # Public ownership tokens (they ship in the HTML), so repository variables, not secrets (docs/deploy.md section 15).
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
        run: |
          rm -rf out
          bun run build
      - name: Script policy check of the production out/
        # The artifact that ships (tests P4).
        run: bun scripts/scan-export.ts out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-production
          path: out/
          retention-days: 30

  e2e:
    # Only without a reusable CI result (or with rerun_e2e): the same sharded suite as CI, against
    # the same commit (built without the beacon).
    name: E2E shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    needs: [resolve, verify, site]
    if: needs.verify.outputs.reuse != 'true'
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: ./.github/actions/setup
        with:
          playwright: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-test
          path: out
      - name: Playwright e2e (shard ${{ matrix.shard }}/8)
        run: bun run e2e:shard ${{ matrix.shard }}/8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: blob-report-deploy-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  deploy:
    name: Cloudflare Pages production
    runs-on: ubuntu-latest
    needs: [resolve, verify, site, e2e]
    # After the shards passed, or straight after the build when the CI result was reused (e2e skipped).
    if: ${{ !cancelled() && needs.site.result == 'success' && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
    permissions:
      contents: read
      deployments: write
      issues: read
      checks: read
      actions: read
    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://kurniadi.pages.dev' }}
    env:
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Check deploy configuration
        id: gate
        env:
          HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_SECRETS" = "true" ] && [ -n "$CF_PAGES_PROJECT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID or the CF_PAGES_PROJECT variable is not set; skipping the production deploy."
          fi
      # Deploy from a checkout: `wrangler pages deploy` bundles functions/ (Ask the HQ) and reads
      # the bindings in wrangler.toml from the working directory (docs/ask-runbook.md).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: site-production
          path: out
      # Chunks whose text changed since the committed embeddings (the weekly live facts, a content PR) get their
      # bge-m3 vector here, so the published pack is fully hybrid; a failure only leaves them on BM25.
      - name: Embed new Ask knowledge chunks
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        env:
          CF_EVAL_TOKEN: ${{ secrets.CF_EVAL_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/ask-embed.ts --deploy
      - name: Build the Ask the HQ knowledge pack
        if: steps.gate.outputs.enabled == 'true'
        run: bun scripts/build-knowledge.ts
      - name: Fast path still open (no deploy-rollback issue)
        id: still
        # A red main CI may have opened it while this run built (rollback.yml opens it before it rolls back).
        if: steps.gate.outputs.enabled == 'true' && needs.verify.outputs.fast == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bun scripts/merge-gate.ts --repo "$REPO" --check-block-only true
      - name: Fast path closed meanwhile, so wait for main CI on this commit
        id: ci
        if: steps.still.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bun scripts/ci-status.ts --repo "$REPO" --sha "$SHA" --wait-minutes 40 --grace-minutes 3
      - name: Require a complete green main CI
        if: steps.still.outputs.blocked == 'true' && steps.ci.outputs.reuse != 'true'
        run: |
          echo "::error::No complete green CI on $SHA; not uploading. Rerun CI or deploy by hand (docs/deploy.md)."
          exit 1
      # hq-office before the upload: Pages rejects a deploy whose service binding (OFFICE in wrangler.toml) names a
      # missing Worker. After the gates above, so the Worker ships only with a site that may ship. rollback.yml rolls
      # it back with Pages. Runbook: workers/office/README.md.
      - name: hq-office Worker configured?
        id: office
        if: steps.gate.outputs.enabled == 'true'
        env:
          SKIP: ${{ vars.OFFICE_WORKER_DEPLOY == 'false' }}
        run: |
          if [ "$SKIP" = "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OFFICE_WORKER_DEPLOY is false; the hq-office Worker is not deployed by this run."
          elif [ ! -f workers/office/wrangler.toml ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::workers/office is not in ${SHA:0:7}; the hq-office Worker stays at its live version."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy hq-office and set its secrets
        id: office_deploy
        if: steps.office.outputs.enabled == 'true'
        # A failed Worker deploy must not stop the site upload while the Worker already exists; the check after the
        # smoke check turns the job red.
        continue-on-error: true
        working-directory: workers/office
        # The deploy token and the Worker secrets only in this step (S4, H1); a missing secret is skipped, so the
        # Worker answers 503 on that route until the owner adds it.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OFFICE_INGEST_KEY: ${{ secrets.OFFICE_INGEST_KEY }}
          # Stored as OFFICE_GITHUB_WEBHOOK_SECRET: GitHub rejects secret names that start with GITHUB_.
          GITHUB_WEBHOOK_SECRET: ${{ secrets.OFFICE_GITHUB_WEBHOOK_SECRET }}
        run: |
          set -o pipefail
          bunx wrangler deploy
          if [ -n "$OFFICE_INGEST_KEY" ]; then
            printf '%s' "$OFFICE_INGEST_KEY" | bunx wrangler secret put OFFICE_INGEST_KEY > /dev/null
          else
            echo "::notice::OFFICE_INGEST_KEY is not set; POST /api/office/beat answers 503."
          fi
          if [ -n "$GITHUB_WEBHOOK_SECRET" ]; then
            printf '%s' "$GITHUB_WEBHOOK_SECRET" | bunx wrangler secret put GITHUB_WEBHOOK_SECRET > /dev/null
          else
            echo "::notice::GITHUB_WEBHOOK_SECRET is not set; POST /api/office/github answers 503."
          fi
      - name: Publish the Ask knowledge pack to KV
        id: publish
        if: steps.gate.outputs.enabled == 'true'
        # Uploads this build's pack value (validated, immutable, never flipped here) before the new code goes live, so
        # the new Function always finds its pinned version (spec 2026-10-19 section 4.5). The deploy token only here (H1).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/ask-pack.ts publish --commit "$SHA"
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.gate.outputs.enabled == 'true'
        # The deploy token only in this step (S4, H1).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler from the lockfile (devDependency, exact version; S4), never a runtime-resolved range.
          # pipefail: a failed upload must fail this step (tee alone would hide wrangler's exit code).
          set -o pipefail
          bunx wrangler pages deploy out --project-name="$CF_PAGES_PROJECT" --branch=main --commit-hash="$SHA" --commit-dirty=true | tee deploy.log
          URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -n1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Flip the Ask knowledge pack pointer
        id: flip
        if: steps.gate.outputs.enabled == 'true'
        # Right after the upload, before the smoke check (which compares the status asOf with this pack's date).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: bun scripts/ask-pack.ts flip "$VERSION"
      - name: Smoke-check production
        if: steps.gate.outputs.enabled == 'true'
        env:
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
        run: bun scripts/deploy-smoke.ts --site "$NEXT_PUBLIC_SITE_URL" --timeout 300
      - name: Flip the Ask knowledge pack pointer back
        # The smoke check (or a later step) failed after the flip: production keeps serving the previous pack.
        if: failure() && steps.flip.outcome == 'success' && steps.publish.outputs.previous != '' && steps.publish.outputs.previous != steps.publish.outputs.version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.publish.outputs.previous }}
        run: bun scripts/ask-pack.ts flip "$PREVIOUS"
      - name: hq-office Worker deploy failed
        if: steps.office_deploy.outcome == 'failure'
        run: |
          echo "::error::The hq-office Worker deploy or a secret put failed (step \"Deploy hq-office and set its secrets\"); the site was uploaded. Fix it and rerun (workers/office/README.md)."
          exit 1
      - name: Summary
        if: steps.gate.outputs.enabled == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          FAST: ${{ needs.verify.outputs.fast }}
          PR: ${{ needs.verify.outputs.pr }}
          PACK: ${{ steps.publish.outputs.version }}
          PREVIOUS_PACK: ${{ steps.publish.outputs.previous }}
        run: |
          {
            echo "Deployed \`$SHA\` to Cloudflare Pages project \`$CF_PAGES_PROJECT\`; the smoke check passed."
            echo ""
            echo "- Deployment: $URL"
            echo "- Ask knowledge pack: \`$PACK\` (previous \`${PREVIOUS_PACK:-none}\`)"
            echo "- Production: $NEXT_PUBLIC_SITE_URL"
            if [ "$FAST" = "true" ]; then echo "- Fast path: #$PR (main CI still runs; rollback.yml rolls back if it fails)"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  stats-worker:
    name: hq-stats Worker
    runs-on: ubuntu-latest
    needs: [resolve, deploy]
    # After the site deployed. Public visit stats: proves CF_EVAL_TOKEN can read Web Analytics first (fails
    # loudly otherwise), then deploys workers/stats and sets its secrets from GitHub secrets. The repository
    # variable STATS_WORKER_DEPLOY = "false" skips it (for example while the deploy token lacks Workers
    # permissions and the Worker was deployed by hand, workers/stats/README.md).
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    timeout-minutes: 10
    # Same main-only environment as the Pages deploy (its secrets), without a second deployment record.
    environment:
      name: production
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Check configuration
        id: gate
        env:
          HAS: ${{ (secrets.CF_STATS_TOKEN != '' || secrets.CF_EVAL_TOKEN != '') && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          SKIP: ${{ vars.STATS_WORKER_DEPLOY == 'false' }}
        run: |
          if [ "$SKIP" = "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::STATS_WORKER_DEPLOY is false; the hq-stats Worker is not deployed by this run."
          elif [ "$HAS" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CF_STATS_TOKEN (or CF_EVAL_TOKEN), CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the hq-stats Worker."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.enabled == 'true'
      - name: Analytics token can read Web Analytics and Analytics Engine
        if: steps.gate.outputs.enabled == 'true'
        env:
          STATS_ANALYTICS_TOKEN: ${{ secrets.CF_STATS_TOKEN || secrets.CF_EVAL_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/stats-token-check.ts analytics
      - name: Deploy token can deploy Workers
        if: steps.gate.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/stats-token-check.ts deploy
      - name: Deploy hq-stats and set its secrets
        if: steps.gate.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          # Analytics-only token for the Worker (decision 4); CF_EVAL_TOKEN until the owner creates it.
          WA_TOKEN: ${{ secrets.CF_STATS_TOKEN || secrets.CF_EVAL_TOKEN }}
          WA_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/stats
          wranglerVersion: "4.151.3"
          packageManager: npm
          quiet: true
          command: deploy
          secrets: |
            WA_TOKEN
            WA_ACCOUNT_ID

  report:
    name: Report a failed deploy
    runs-on: ubuntu-latest
    needs: [resolve, verify, site, e2e, deploy, stats-worker]
    if: ${{ failure() }}
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.resolve.outputs.sha }}
      REASON: ${{ inputs.reason }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the deploy-failed issue
        run: |
          gh label create deploy-failed --color B60205 --description "Production deploy failed (deploy.yml)" 2>/dev/null || true
          body="Production deploy of \`${SHA:-unknown}\` failed: $RUN_URL"
          if [ -n "$REASON" ]; then body="$body"$'\n\n'"Reason: $REASON"; fi
          body="$body"$'\n\n'"Production keeps serving the previous deployment. Fix the cause, then rerun the workflow (docs/deploy.md)."
          number=$(gh issue list --label deploy-failed --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "Production deploy failed" --label deploy-failed --body "$body"
          fi
