name: Ask the HQ eval

# Nightly real-model checks of Ask the HQ (spec section 9). Neuron budget (owner decision 2026-10-19): evals use
# under 20% of the 10,000 free daily Workers AI neurons, which production Ask shares.
#   - smoke: the fixed 20-question set (scripts/ask-eval.ts SMOKE_GOLDEN, SMOKE_REDTEAM) on the primary Workers AI
#     model, about 800 neurons; needs CF_EVAL_TOKEN (Workers AI Read, AI Gateway Read, Account Analytics Read).
#   - golden (passThreshold of tests/ask/golden.json) on the first Groq backup model; red team (every attack
#     must end safely) and one seventh of the curated pills (`--slice day/7`, 90% must get a real answer, every
#     pill once a week) on the second. They need the GROQ_API_KEY environment secret (the same Groq account as
#     the Pages secret) and make no Workers AI call. Each run prints its Groq tokens (free tier: 200,000 per model
#     per day, shared with production's backup tier).
# A red-team failure opens or updates one issue labelled ask-redteam. Jobs skip (green, with a notice) while
# their secret is missing (docs/ask-runbook.md).
# The optional purge job deletes AI Gateway logs older than 7 days when CF_LOGS_TOKEN is set.
# Every job uses the `production` environment without a deployment (main only, so its Cloudflare
# secrets never reach other branches); secrets are passed only to the steps that read them (H1).

on:
  schedule:
    # 03:30 WIB (20:30 UTC).
    - cron: "30 20 * * *"
  workflow_dispatch:

concurrency:
  group: ask-eval
  cancel-in-progress: false

permissions:
  contents: read

env:
  ASK_GATEWAY_ID: shinyq-hq
  # The Groq backup models of wrangler.toml ASK_BACKUP_MODELS, in order.
  EVAL_GROQ_FIRST: qwen/qwen3.8-27b
  EVAL_GROQ_SECOND: openai/gpt-oss-120b

jobs:
  smoke:
    name: Smoke set (Workers AI, 20 questions)
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    env:
      ASK_EVAL_REPORT: ask-eval-smoke.md
    steps:
      - name: Check token
        id: gate
        env:
          CF_EVAL_TOKEN: ${{ secrets.CF_EVAL_TOKEN != '' }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID != '' || secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$CF_EVAL_TOKEN" = "true" ] && [ "$CF_ACCOUNT_ID" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CF_EVAL_TOKEN or CF_ACCOUNT_ID is not set; skipping the smoke eval."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.enabled == 'true'
      - name: Smoke set on the primary model
        if: steps.gate.outputs.enabled == 'true'
        env:
          CF_EVAL_TOKEN: ${{ secrets.CF_EVAL_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAFETY_BLOCKLIST: ${{ secrets.SAFETY_BLOCKLIST }}
        run: bun scripts/ask-eval.ts smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' }}
        with:
          name: ask-eval-smoke
          path: ask-eval-smoke.md
          retention-days: 14
          if-no-files-found: ignore

  golden:
    name: Golden set (Groq backup model)
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    env:
      ASK_EVAL_REPORT: ask-eval-golden.md
    steps:
      - name: Check token
        id: gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY != '' }}
        run: |
          if [ "$GROQ_API_KEY" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GROQ_API_KEY is not set in the production environment; skipping the golden eval (docs/ask-runbook.md)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.enabled == 'true'
      - name: Golden set
        if: steps.gate.outputs.enabled == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SAFETY_BLOCKLIST: ${{ secrets.SAFETY_BLOCKLIST }}
        run: bun scripts/ask-eval.ts golden --groq "$EVAL_GROQ_FIRST"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' }}
        with:
          name: ask-eval-golden
          path: ask-eval-golden.md
          retention-days: 14
          if-no-files-found: ignore

  suggestions:
    name: Curated pills, one seventh (Groq backup model)
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    env:
      ASK_EVAL_REPORT: ask-eval-suggestions.md
    steps:
      - name: Check token
        id: gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY != '' }}
        run: |
          if [ "$GROQ_API_KEY" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GROQ_API_KEY is not set in the production environment; skipping the curated pill eval (docs/ask-runbook.md)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.enabled == 'true'
      - name: Curated pills (content/ask/suggestions.json)
        if: steps.gate.outputs.enabled == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SAFETY_BLOCKLIST: ${{ secrets.SAFETY_BLOCKLIST }}
        run: bun scripts/ask-eval.ts suggestions --groq "$EVAL_GROQ_SECOND" --slice day/7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' }}
        with:
          name: ask-eval-suggestions
          path: ask-eval-suggestions.md
          retention-days: 14
          if-no-files-found: ignore

  redteam:
    name: Red-team set (Groq backup model)
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    permissions:
      contents: read
      issues: write
    env:
      ASK_EVAL_REPORT: ask-eval-redteam.md
    steps:
      - name: Check token
        id: gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY != '' }}
        run: |
          if [ "$GROQ_API_KEY" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GROQ_API_KEY is not set in the production environment; skipping the red-team eval (docs/ask-runbook.md)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.enabled == 'true'
      - name: Red-team set
        id: redteam
        if: steps.gate.outputs.enabled == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SAFETY_BLOCKLIST: ${{ secrets.SAFETY_BLOCKLIST }}
        run: bun scripts/ask-eval.ts redteam --groq "$EVAL_GROQ_SECOND"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' }}
        with:
          name: ask-eval-redteam
          path: ask-eval-redteam.md
          retention-days: 14
          if-no-files-found: ignore
      - name: Open or update the red-team issue
        # The issue is public: blocklisted terms (client names) are redacted from the report first.
        if: failure() && steps.redteam.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SAFETY_BLOCKLIST: ${{ secrets.SAFETY_BLOCKLIST }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create ask-redteam --repo "$REPO" --color B60205 --description "Ask the HQ nightly red-team failure" 2>/dev/null || true
          {
            echo "The nightly red-team run failed: $RUN_URL"
            echo ""
            echo "Playbook: docs/ask-runbook.md, section \"Incident playbook\". Full report: run artifact \`ask-eval-redteam\`."
            echo ""
            if [ -f ask-eval-redteam.md ]; then
              bun scripts/content-gap.ts --redact ask-eval-redteam.md | head -c 60000
            fi
          } > redteam-issue.md
          number=$(gh issue list --repo "$REPO" --label ask-redteam --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body-file redteam-issue.md
          else
            gh issue create --repo "$REPO" --title "Ask the HQ red-team failure" --label ask-redteam --body-file redteam-issue.md
          fi

  purge-logs:
    name: Purge AI Gateway logs older than 7 days
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    steps:
      - name: Check token
        id: gate
        env:
          CF_LOGS_TOKEN: ${{ secrets.CF_LOGS_TOKEN != '' }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID != '' || secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$CF_LOGS_TOKEN" = "true" ] && [ "$CF_ACCOUNT_ID" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CF_LOGS_TOKEN is not set; skipping the AI Gateway log purge (optional, docs/ask-runbook.md)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.enabled == 'true'
      - name: Purge
        if: steps.gate.outputs.enabled == 'true'
        env:
          CF_LOGS_TOKEN: ${{ secrets.CF_LOGS_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/purge-ask-logs.ts
