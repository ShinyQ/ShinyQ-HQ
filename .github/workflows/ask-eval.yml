name: Ask the HQ eval

# Nightly real-model checks of Ask the HQ (spec section 9). Neuron budget (owner decision 2026-10-19): evals use
# under 20% of the 10,000 free daily Workers AI neurons, which production Ask shares.
#   - smoke: the fixed 21-question set (scripts/ask-eval.ts SMOKE_GOLDEN, SMOKE_REDTEAM) on the primary Workers AI
#     model, about 840 neurons; needs CF_EVAL_TOKEN (Workers AI Read, AI Gateway Read, Account Analytics Read).
#   - Groq (owner direction 2026-10-20): the bulk runs on Groq models production never uses, so evals never compete
#     with the backup tier. Groq limits are per model: 200,000 tokens, 1,000 requests and 8,000 tokens per minute a
#     day on the free plan; about 3,000 tokens per model call. The key offers one capable non-production chat model
#     (EVAL_GROQ_EVAL), so the golden set rotates over three nights:
#       EVAL_GROQ_EVAL: a third of the golden set (`--slice day/3`, the set's allowed misses apply to the third),
#         then a twenty-first of the curated pills (`--slice day/21`), then a fourth of the red team (`--slice day/4`),
#         one after the other (one per-minute limit); the worst night of the 84-day cycle is 52 calls, about 78%.
#       EVAL_GROQ_STRESS: the whole red team on a small model, a stress test of the deterministic guards and output
#         checks (about 31 calls, 47%).
#       EVAL_GROQ_BACKUP (production's first backup): the 10-item fidelity set (scripts/ask-eval.ts
#         FIDELITY_GOLDEN, about 10 calls, 15%), so the real backup is still checked.
#     Every run prints its planned tokens first and stops above 80% of the model's day. They need the GROQ_API_KEY
#     environment secret and make no Workers AI call.
# A red-team failure opens or updates one issue labelled ask-redteam. Jobs skip (green, with a notice) while
# their secret is missing (docs/ask-runbook.md).
# The optional purge job deletes AI Gateway logs older than 7 days when CF_LOGS_TOKEN is set.
# Every job uses the `production` environment without a deployment (main only, so its Cloudflare
# secrets never reach other branches); secrets are passed only to the steps that read them (H1).

on:
  schedule:
    # 03:30 WIB (20:30 UTC).
    - cron: "30 20 * * *"
  workflow_dispatch:

concurrency:
  group: ask-eval
  cancel-in-progress: false

permissions:
  contents: read

env:
  ASK_GATEWAY_ID: shinyq-hq
  # Eval models (owner direction 2026-10-20): EVAL and STRESS are never production tiers; BACKUP is the first model
  # of wrangler.toml ASK_BACKUP_MODELS and runs only the fidelity set.
  EVAL_GROQ_EVAL: openai/gpt-oss-20b
  EVAL_GROQ_STRESS: allam-2-7b
  EVAL_GROQ_BACKUP: qwen/qwen3.8-27b

jobs:
  smoke:
    name: Smoke set (Workers AI, 20 questions)
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    env:
      ASK_EVAL_REPORT: ask-eval-smoke.md
    steps:
      - name: Check token
        id: gate
        env:
          CF_EVAL_TOKEN: ${{ secrets.CF_EVAL_TOKEN != '' }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID != '' || secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$CF_EVAL_TOKEN" = "true" ] && [ "$CF_ACCOUNT_ID" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CF_EVAL_TOKEN or CF_ACCOUNT_ID is not set; skipping the smoke eval."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.enabled == 'true'
      - name: Smoke set on the primary model
        if: steps.gate.outputs.enabled == 'true'
        env:
          CF_EVAL_TOKEN: ${{ secrets.CF_EVAL_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/ask-eval.ts smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' }}
        with:
          name: ask-eval-smoke
          path: ask-eval-smoke.md
          retention-days: 14
          if-no-files-found: ignore

  golden:
    name: Golden set, one third (Groq eval model)
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    env:
      ASK_EVAL_REPORT: ask-eval-golden.md
    steps:
      - name: Check token
        id: gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY != '' }}
        run: |
          if [ "$GROQ_API_KEY" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GROQ_API_KEY is not set in the production environment; skipping the golden eval (docs/ask-runbook.md)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.enabled == 'true'
      - name: Golden set
        if: steps.gate.outputs.enabled == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: bun scripts/ask-eval.ts golden --groq "$EVAL_GROQ_EVAL" --slice day/3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' }}
        with:
          name: ask-eval-golden
          path: ask-eval-golden.md
          retention-days: 14
          if-no-files-found: ignore

  suggestions:
    name: Curated pills, one twenty-first (Groq eval model)
    # After the golden set: both use the eval model, whose per-minute token limit they would otherwise share.
    needs: golden
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    env:
      ASK_EVAL_REPORT: ask-eval-suggestions.md
    steps:
      - name: Check token
        id: gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY != '' }}
        run: |
          if [ "$GROQ_API_KEY" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GROQ_API_KEY is not set in the production environment; skipping the curated pill eval (docs/ask-runbook.md)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.enabled == 'true'
      - name: Curated pills (content/ask/suggestions.json)
        if: steps.gate.outputs.enabled == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: bun scripts/ask-eval.ts suggestions --groq "$EVAL_GROQ_EVAL" --slice day/21
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' }}
        with:
          name: ask-eval-suggestions
          path: ask-eval-suggestions.md
          retention-days: 14
          if-no-files-found: ignore

  redteam:
    name: Red-team set (Groq stress and eval models)
    # The eval-model slice runs after the pills, on the same per-minute limit.
    needs: suggestions
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    permissions:
      contents: read
      issues: write
    env:
      ASK_EVAL_REPORT: ask-eval-redteam.md
    steps:
      - name: Check token
        id: gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY != '' }}
        run: |
          if [ "$GROQ_API_KEY" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GROQ_API_KEY is not set in the production environment; skipping the red-team eval (docs/ask-runbook.md)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.enabled == 'true'
      - name: Red-team set, every item (stress model)
        id: redteam
        if: steps.gate.outputs.enabled == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: bun scripts/ask-eval.ts redteam --groq "$EVAL_GROQ_STRESS"
      - name: Red-team set, one fourth (eval model)
        id: redteam_eval
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ASK_EVAL_REPORT: ask-eval-redteam-eval.md
        run: bun scripts/ask-eval.ts redteam --groq "$EVAL_GROQ_EVAL" --slice day/4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' }}
        with:
          name: ask-eval-redteam
          path: |
            ask-eval-redteam.md
            ask-eval-redteam-eval.md
          retention-days: 14
          if-no-files-found: ignore
      - name: Open or update the red-team issue
        if: failure() && (steps.redteam.outcome == 'failure' || steps.redteam_eval.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create ask-redteam --repo "$REPO" --color B60205 --description "Ask the HQ nightly red-team failure" 2>/dev/null || true
          {
            echo "The nightly red-team run failed: $RUN_URL"
            echo ""
            echo "Playbook: docs/ask-runbook.md, section \"Incident playbook\". Full report: run artifact \`ask-eval-redteam\`."
            echo ""
            for report in ask-eval-redteam.md ask-eval-redteam-eval.md; do
              if [ -f "$report" ]; then
                head -c 30000 "$report"
                echo ""
              fi
            done
          } > redteam-issue.md
          number=$(gh issue list --repo "$REPO" --label ask-redteam --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body-file redteam-issue.md
          else
            gh issue create --repo "$REPO" --title "Ask the HQ red-team failure" --label ask-redteam --body-file redteam-issue.md
          fi

  fidelity:
    name: Fidelity set (production Groq backup, 10 questions)
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    env:
      ASK_EVAL_REPORT: ask-eval-fidelity.md
    steps:
      - name: Check token
        id: gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY != '' }}
        run: |
          if [ "$GROQ_API_KEY" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GROQ_API_KEY is not set in the production environment; skipping the fidelity eval (docs/ask-runbook.md)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.enabled == 'true'
      - name: Fidelity set on the production backup model
        if: steps.gate.outputs.enabled == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: bun scripts/ask-eval.ts fidelity --groq "$EVAL_GROQ_BACKUP"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' }}
        with:
          name: ask-eval-fidelity
          path: ask-eval-fidelity.md
          retention-days: 14
          if-no-files-found: ignore

  purge-logs:
    name: Purge AI Gateway logs older than 7 days
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    steps:
      - name: Check token
        id: gate
        env:
          CF_LOGS_TOKEN: ${{ secrets.CF_LOGS_TOKEN != '' }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID != '' || secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$CF_LOGS_TOKEN" = "true" ] && [ "$CF_ACCOUNT_ID" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CF_LOGS_TOKEN is not set; skipping the AI Gateway log purge (optional, docs/ask-runbook.md)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.enabled == 'true'
      - name: Purge
        if: steps.gate.outputs.enabled == 'true'
        env:
          CF_LOGS_TOKEN: ${{ secrets.CF_LOGS_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/purge-ask-logs.ts
