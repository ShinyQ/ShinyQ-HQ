name: Ask the HQ eval

# Nightly real-model checks of Ask the HQ (spec section 9): the golden set must score at least
# 40/42, at least 90% of the curated pill questions (content/ask/suggestions.json, EN and ID) must get
# a real answer, and every red-team attack must end safely. A red-team failure opens or updates one issue
# labelled ask-redteam. Skips (green, with a notice) until the CF_EVAL_TOKEN secret exists
# (Workers AI Read, AI Gateway Read, Account Analytics Read; docs/ask-runbook.md).
# The optional purge job deletes AI Gateway logs older than 7 days when CF_LOGS_TOKEN is set.
# Every job uses the `production` environment without a deployment (main only, so its Cloudflare
# secrets never reach other branches); secrets are passed only to the steps that read them (H1).

on:
  schedule:
    # 03:30 WIB (20:30 UTC).
    - cron: "30 20 * * *"
  workflow_dispatch:

concurrency:
  group: ask-eval
  cancel-in-progress: false

permissions:
  contents: read

env:
  ASK_GATEWAY_ID: shinyq-hq

jobs:
  golden:
    name: Golden set (real model)
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    env:
      ASK_EVAL_REPORT: ask-eval-golden.md
    steps:
      - name: Check token
        id: gate
        env:
          CF_EVAL_TOKEN: ${{ secrets.CF_EVAL_TOKEN != '' }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID != '' || secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$CF_EVAL_TOKEN" = "true" ] && [ "$CF_ACCOUNT_ID" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CF_EVAL_TOKEN or CF_ACCOUNT_ID is not set; skipping the golden eval."
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.enabled == 'true'
      - name: Golden set
        if: steps.gate.outputs.enabled == 'true'
        env:
          CF_EVAL_TOKEN: ${{ secrets.CF_EVAL_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAFETY_BLOCKLIST: ${{ secrets.SAFETY_BLOCKLIST }}
        run: bun scripts/ask-eval.ts golden
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' }}
        with:
          name: ask-eval-golden
          path: ask-eval-golden.md
          retention-days: 14
          if-no-files-found: ignore

  suggestions:
    name: Curated pills (real model)
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    env:
      ASK_EVAL_REPORT: ask-eval-suggestions.md
    steps:
      - name: Check token
        id: gate
        env:
          CF_EVAL_TOKEN: ${{ secrets.CF_EVAL_TOKEN != '' }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID != '' || secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$CF_EVAL_TOKEN" = "true" ] && [ "$CF_ACCOUNT_ID" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CF_EVAL_TOKEN or CF_ACCOUNT_ID is not set; skipping the curated pill eval."
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.enabled == 'true'
      - name: Curated pills (content/ask/suggestions.json)
        if: steps.gate.outputs.enabled == 'true'
        env:
          CF_EVAL_TOKEN: ${{ secrets.CF_EVAL_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAFETY_BLOCKLIST: ${{ secrets.SAFETY_BLOCKLIST }}
        run: bun scripts/ask-eval.ts suggestions
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' }}
        with:
          name: ask-eval-suggestions
          path: ask-eval-suggestions.md
          retention-days: 14
          if-no-files-found: ignore

  redteam:
    name: Red-team set (real model)
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    permissions:
      contents: read
      issues: write
    env:
      ASK_EVAL_REPORT: ask-eval-redteam.md
    steps:
      - name: Check token
        id: gate
        env:
          CF_EVAL_TOKEN: ${{ secrets.CF_EVAL_TOKEN != '' }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID != '' || secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$CF_EVAL_TOKEN" = "true" ] && [ "$CF_ACCOUNT_ID" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CF_EVAL_TOKEN or CF_ACCOUNT_ID is not set; skipping the red-team eval."
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.enabled == 'true'
      - name: Red-team set
        id: redteam
        if: steps.gate.outputs.enabled == 'true'
        env:
          CF_EVAL_TOKEN: ${{ secrets.CF_EVAL_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAFETY_BLOCKLIST: ${{ secrets.SAFETY_BLOCKLIST }}
        run: bun scripts/ask-eval.ts redteam
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' }}
        with:
          name: ask-eval-redteam
          path: ask-eval-redteam.md
          retention-days: 14
          if-no-files-found: ignore
      - name: Open or update the red-team issue
        # The issue is public: blocklisted terms (client names) are redacted from the report first.
        if: failure() && steps.redteam.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SAFETY_BLOCKLIST: ${{ secrets.SAFETY_BLOCKLIST }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create ask-redteam --repo "$REPO" --color B60205 --description "Ask the HQ nightly red-team failure" 2>/dev/null || true
          {
            echo "The nightly red-team run failed: $RUN_URL"
            echo ""
            echo "Playbook: docs/ask-runbook.md, section \"Incident playbook\". Full report: run artifact \`ask-eval-redteam\`."
            echo ""
            if [ -f ask-eval-redteam.md ]; then
              bun scripts/content-gap.ts --redact ask-eval-redteam.md | head -c 60000
            fi
          } > redteam-issue.md
          number=$(gh issue list --repo "$REPO" --label ask-redteam --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body-file redteam-issue.md
          else
            gh issue create --repo "$REPO" --title "Ask the HQ red-team failure" --label ask-redteam --body-file redteam-issue.md
          fi

  purge-logs:
    name: Purge AI Gateway logs older than 7 days
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    steps:
      - name: Check token
        id: gate
        env:
          CF_LOGS_TOKEN: ${{ secrets.CF_LOGS_TOKEN != '' }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID != '' || secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$CF_LOGS_TOKEN" = "true" ] && [ "$CF_ACCOUNT_ID" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CF_LOGS_TOKEN is not set; skipping the AI Gateway log purge (optional, docs/ask-runbook.md)."
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.enabled == 'true'
      - name: Purge
        if: steps.gate.outputs.enabled == 'true'
        env:
          CF_LOGS_TOKEN: ${{ secrets.CF_LOGS_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/purge-ask-logs.ts
