name: Refresh live facts

# Weekly live facts for the stats ring, the Page View and Ask the HQ (spec section 6.2):
# GitHub contributions and public repos, Hugging Face models and downloads, credential URL checks.
# Opens (or refreshes) one PR only when a value changed, then merges it itself once CI is green
# (owner decision 3). PRs pushed with GITHUB_TOKEN do not trigger the pull_request CI run, so this
# job dispatches ci.yml on the PR branch (GITHUB_TOKEN may trigger workflow_dispatch), waits for that
# run on the exact pushed commit, and merges only when the required jobs succeeded. Otherwise the PR
# stays open and this job fails. The `main` ruleset (require a PR and the required checks, security
# S5) accepts this merge: the dispatched run reports the checks on the PR head commit. No personal
# access token is needed (docs/ask-runbook.md). `actions: write` dispatches ci.yml and deploy.yml.
# After the merge it dispatches deploy.yml for the merge commit (production deploy and smoke check).

on:
  schedule:
    # Mondays 02:00 WIB (Sunday 19:00 UTC).
    - cron: "0 19 * * 0"
  workflow_dispatch:

concurrency:
  group: refresh-facts
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Dispatch and read the CI run on the facts branch.
  actions: write

jobs:
  refresh:
    name: Refresh live facts
    runs-on: ubuntu-latest
    # CI takes about 10 minutes (build, 4 e2e shards, Lighthouse); the wait below gives up after 45.
    timeout-minutes: 60
    env:
      BRANCH: chore/refresh-live-facts
      CI_WORKFLOW: ci.yml
      REQUIRED_JOBS: "Typecheck, lint, unit tests|Build, CV and e2e"
    steps:
      # The only checkout that keeps its credentials: this job pushes the facts branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Fetch live facts
        id: facts
        env:
          # Public data only; GraphQL needs a token even for public contribution counts.
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/refresh-facts.ts
      - name: Open or refresh the PR
        id: pr
        if: steps.facts.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AS_OF: ${{ steps.facts.outputs.as_of }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add content/generated/dynamic-facts.json
          git commit -m "chore: refresh live facts (asOf $AS_OF)"
          git push --force origin "$BRANCH"
          title="Refresh live facts (asOf $AS_OF)"
          body="Weekly refresh of \`content/generated/dynamic-facts.json\` by \`scripts/refresh-facts.ts\` (numbers, dates, booleans and IDs only). The refresh-facts workflow runs CI on this branch and merges it when the required jobs pass."
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
            number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run CI on the facts branch
        id: ci
        if: steps.facts.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          gh workflow run "$CI_WORKFLOW" --ref "$BRANCH"
          # The dispatch API returns no run id: poll for the run on the pushed commit.
          run_id=""
          for _ in $(seq 1 30); do
            sleep 10
            run_id=$(gh run list --workflow "$CI_WORKFLOW" --branch "$BRANCH" --event workflow_dispatch --limit 10 \
              --json databaseId,headSha --jq "map(select(.headSha == \"$SHA\"))[0].databaseId // empty")
            [ -n "$run_id" ] && break
          done
          if [ -z "$run_id" ]; then
            echo "::error::No CI run started for $SHA on $BRANCH."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "CI run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id" >> "$GITHUB_STEP_SUMMARY"
          # `gh run watch` exits non-zero on failure; the job check below decides either way.
          timeout 45m gh run watch "$run_id" --interval 30 --exit-status > /dev/null || true
          status=$(gh run view "$run_id" --json status --jq .status)
          if [ "$status" != "completed" ]; then
            echo "::error::CI run $run_id did not finish within 45 minutes ($status). The PR stays open."
            exit 1
          fi
          passed=$(gh run view "$run_id" --json jobs --jq "[.jobs[] | select(.name | test(\"^($REQUIRED_JOBS)\$\")) | select(.conclusion == \"success\")] | length")
          if [ "$passed" != "2" ]; then
            echo "::error::Required CI jobs did not all succeed on $SHA (run $run_id). The PR stays open for review."
            exit 1
          fi
      - name: Merge the PR
        if: steps.facts.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
        # --match-head-commit refuses to merge if the branch moved after CI ran.
        run: gh pr merge "$NUMBER" --squash --delete-branch --match-head-commit "$SHA"
      - name: Deploy production
        # Only this workflow deploys automatically (owner decision 2026-10-11); a push to main never
        # does. Set the repository variable AUTO_DEPLOY_FACTS=false to stop it (docs/deploy.md).
        if: steps.facts.outputs.changed == 'true' && vars.AUTO_DEPLOY_FACTS != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
          AS_OF: ${{ steps.facts.outputs.as_of }}
        run: |
          merged=$(gh pr view "$NUMBER" --json mergeCommit --jq .mergeCommit.oid)
          gh workflow run deploy.yml --ref main -f sha="$merged" -f reason="Live facts as of $AS_OF (#$NUMBER)"
          echo "Dispatched deploy.yml for $merged: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/deploy.yml" >> "$GITHUB_STEP_SUMMARY"
      - name: Summary
        env:
          CHANGED: ${{ steps.facts.outputs.changed }}
          AS_OF: ${{ steps.facts.outputs.as_of }}
        run: |
          echo "Live facts changed: ${CHANGED:-false} (asOf ${AS_OF:-unknown})." >> "$GITHUB_STEP_SUMMARY"
