name: Screenshots

# Visual captures (e2e/screenshots.spec.ts and e2e/pageview-visual.spec.ts) are slow on
# SwiftShader (about 16 minutes on one worker), so they are off the PR path. They run:
# - nightly on main,
# - on demand (Actions > Screenshots > Run workflow, any branch),
# - on a PR labelled `screenshots`, or one that changes docs/design/**.
# Artifacts: `screenshots` (PNG files) for review.

on:
  schedule:
    # 19:30 UTC is 02:30 in Jakarta.
    - cron: "30 19 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  # Adding an unrelated label gets its own group, so it never cancels a running capture.
  group: screenshots-${{ github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'screenshots') && github.run_id || 'run' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SAFETY_BLOCKLIST: ${{ secrets.SAFETY_BLOCKLIST }}
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}

jobs:
  gate:
    name: Decide
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ADDED_LABEL: ${{ github.event.label.name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'screenshots') }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          run=false
          if [ "$EVENT" != "pull_request" ]; then
            run=true
          elif [ "$ACTION" = "labeled" ]; then
            # Only the `screenshots` label starts a run; other labels do not.
            [ "$ADDED_LABEL" = "screenshots" ] && run=true
          elif [ "$HAS_LABEL" = "true" ]; then
            run=true
          elif gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' | grep -q '^docs/design/'; then
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Screenshots: $run ($EVENT ${ACTION:-})" >> "$GITHUB_STEP_SUMMARY"

  site:
    name: Build static export
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'content/**', 'messages/**', 'public/**', 'next.config.ts') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      - run: bun run build:web
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-site
          path: out/
          retention-days: 1

  capture:
    name: Screenshots ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    needs: site
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: "true"
      - uses: actions/download-artifact@v8
        with:
          name: screenshots-site
          path: out
      - name: Capture (one worker per runner, SwiftShader is CPU bound)
        env:
          SCREENSHOTS: "1"
        run: bunx playwright test e2e/screenshots.spec.ts e2e/pageview-visual.spec.ts --workers=1 --shard=${{ matrix.shard }}/4 --reporter=list
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: screenshots-${{ matrix.shard }}
          path: screenshots/
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  collect:
    name: Collect screenshots
    runs-on: ubuntu-latest
    needs: capture
    if: ${{ !cancelled() && needs.capture.result != 'skipped' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: screenshots-[0-9]*
          path: screenshots
          merge-multiple: true
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
      - name: Summary
        run: echo "$(find screenshots -name '*.png' | wc -l) screenshots in the \`screenshots\` artifact." >> "$GITHUB_STEP_SUMMARY"
