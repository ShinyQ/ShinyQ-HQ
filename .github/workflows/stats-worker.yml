name: Stats Worker check

# Pull request check for the public visit stats Worker (workers/stats/, hq-stats): bundles the Worker
# with `wrangler deploy --dry-run` and nothing else. Pull request runs never receive a Cloudflare
# secret (security S3): PR code (scripts, lockfile, dependencies) must not see the production deploy
# token. The token checks run only on a manual dispatch from main, in the main-only `production`
# environment, and before every Worker deploy in deploy.yml (job "hq-stats Worker"):
#   - the analytics token (CF_STATS_TOKEN, or CF_EVAL_TOKEN until it exists) can read Web Analytics
#     and Analytics Engine (the Worker's runtime secret WA_TOKEN);
#   - CLOUDFLARE_API_TOKEN can see Workers scripts and the STATS_KV namespace (deploy permissions).
# Not a required check. Runbook: workers/stats/README.md.

on:
  pull_request:
    paths:
      - "workers/stats/**"
      - "src/lib/stats/**"
      - "scripts/stats-token-check.ts"
      - ".github/workflows/stats-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stats-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: hq-stats bundle (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Bundle the Worker (dry run, no secrets)
        working-directory: workers/stats
        # wrangler from the lockfile (devDependency, exact version; S4).
        run: bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/hq-stats"

  tokens:
    name: hq-stats tokens
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Manual dispatch from main only; the environment's branch policy enforces the same.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment:
      name: production
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Secrets available
        id: gate
        env:
          HAS: ${{ (secrets.CF_STATS_TOKEN != '' || secrets.CF_EVAL_TOKEN != '') && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          echo "enabled=$HAS" >> "$GITHUB_OUTPUT"
          if [ "$HAS" != "true" ]; then echo "::notice::Cloudflare secrets are not set; skipping the token checks."; fi
      - name: Analytics token can read Web Analytics and Analytics Engine
        if: steps.gate.outputs.enabled == 'true'
        env:
          STATS_ANALYTICS_TOKEN: ${{ secrets.CF_STATS_TOKEN || secrets.CF_EVAL_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/stats-token-check.ts analytics
      - name: Deploy token (CLOUDFLARE_API_TOKEN) can deploy Workers
        if: steps.gate.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/stats-token-check.ts deploy
