name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Private public-safety blocklist (internal codenames, private repo names).
  # Optional: when unset, only the committed default list is enforced.
  SAFETY_BLOCKLIST: ${{ secrets.SAFETY_BLOCKLIST }}
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  build:
    name: Build, CV and e2e
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build static export and CV PDFs
        run: bun run build
      - name: Playwright smoke tests
        run: bun run e2e
      - name: Screenshots
        run: bun run screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            screenshots/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: out/
          retention-days: 7

  preview:
    name: Cloudflare Pages preview
    runs-on: ubuntu-latest
    needs: build
    # Preview only. Production (kurniadi.pages.dev) is cut over in Phase 6.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: shinyq-hq
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the preview deploy."
          fi
      - uses: actions/download-artifact@v8
        if: steps.secrets.outputs.enabled == 'true'
        with:
          name: site
          path: out
      - uses: oven-sh/setup-bun@v2
        if: steps.secrets.outputs.enabled == 'true'
      - name: Ensure the preview project exists
        if: steps.secrets.outputs.enabled == 'true'
        # Production branch is a branch we never push, so every deploy stays a preview.
        run: bunx wrangler@3 pages project create "$CF_PAGES_PROJECT" --production-branch=production-cutover-phase-6 || true
      - name: Deploy preview
        id: deploy
        if: steps.secrets.outputs.enabled == 'true'
        run: |
          BRANCH="pr-${{ github.event.pull_request.number }}"
          bunx wrangler@3 pages deploy out --project-name="$CF_PAGES_PROJECT" --branch="$BRANCH" --commit-dirty=true | tee deploy.log
          URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -n1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: steps.secrets.outputs.enabled == 'true'
        run: echo "Preview deployed to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
