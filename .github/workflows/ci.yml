name: CI

# PR pipeline: build once, run e2e and the 3D perf gates (e2e/perf/) in parallel shards against the
# same `out/`, then merge the reports. "Build, CV and e2e" is the aggregate job: it fails if
# any job before it failed (Lighthouse and 3D budgets included), so it stays the single required check,
# and it writes the 3D perf summary against the last green main run. Screenshots run in screenshots.yml
# (nightly, label, manual); the game-first timeline in perf-nightly.yml.
#
# Smart CI (docs/agents/ci-and-deploy.md): the `changes` job (scripts/ci-plan.ts) plans which tests a
# pull request needs from its changed paths: the affected e2e specs plus a PR smoke set on a shard count
# sized from e2e/durations.json, the affected 3D perf tests (a --grep; memory-full only for memory paths)
# and the affected Lighthouse URLs. Typecheck, lint, unit tests, the build, the script policy check and og:check
# always run. A push to main whose merged pull request passed CI on the same tree runs only the complement
# of that PR run (its `ci-plan` record, scripts/ci-complement.ts) and merges the PR run's Lighthouse and perf
# reports, so main still covers everything and keeps a full baseline. Manual dispatches (unless
# `complement_pr` is set, a measurement), the nightly schedule, the `full-ci` label, CI or dependency
# changes, unmapped paths, a push without such a PR run and any planner failure run everything: 8 e2e
# and 4 perf shards (2 perf shards on pull requests, so the required checks keep the names `3D perf gates
# 1/2` and `2/2`). A heavy job never skips at the job level (a skipped matrix job would report an
# unexpanded check name and block the required checks): its steps skip and one "Not needed" step
# passes. Complete runs (complement runs included) upload the `ci-full` artifact for the deploy gate
# (scripts/ci-status.ts).
# The nightly schedule runs the full pipeline on main every night, the nightly-only e2e tests (`@nightly`,
# skipped by pull requests and pushes) included, plus the nightly-only `nightly` job
# (also on a dispatch with the `nightly` input), which reads every job's result and opens, updates or
# closes the one `ci-nightly` issue (scripts/ci-nightly.ts; writes only on main, a dry run elsewhere).
# The strict visual gate (scripts/visual-gate.ts) is not here: it needs a real GPU and times out on the
# hosted runners' SwiftShader, so it stays a local gate (docs/agents/performance.md).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 03:15 WIB: after screenshots.yml (19:30 UTC), before the perf-nightly.yml timeline (21:00 UTC).
    - cron: "15 20 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: Also run the nightly-only e2e tests (@nightly) and the ci-nightly issue report
        type: boolean
        default: false
      complement_pr:
        description: Plan the complement of this pull request's green CI run on the same tree, as a push to main does (measurement)
        type: string
        default: ""

concurrency:
  # The nightly gets its own group so it never replaces a pending main push.
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  # PR runs replace each other; main keeps every run, because deploy.yml reuses the result per commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # No NEXT_PUBLIC_CF_BEACON_TOKEN here: test builds never render the Web Analytics beacon, so the
  # e2e cross-origin guard stays strict and test runs never count as page views. Only deploy.yml sets it.

jobs:
  changes:
    # Smart CI (owner decisions 2026-10-17 and 2026-10-18): which heavy jobs this run needs
    # (scripts/ci-plan.ts). Pull requests get a selective plan from their changed paths; a push to main
    # gets the complement of its merged PR's green run on the same tree; other pushes, dispatches and the
    # nightly schedule run everything, and so does any planner failure. Every run uploads its record
    # (`ci-plan`), which a later complement run reads.
    name: Plan CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      # Lists the PR's green CI runs and downloads their `ci-plan` record.
      actions: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      e2e: ${{ steps.plan.outputs.e2e }}
      e2e_files: ${{ steps.plan.outputs.e2e_files }}
      e2e_shards: ${{ steps.plan.outputs.e2e_shards }}
      e2e_total: ${{ steps.plan.outputs.e2e_total }}
      perf: ${{ steps.plan.outputs.perf }}
      perf_grep: ${{ steps.plan.outputs.perf_grep }}
      perf_shards: ${{ steps.plan.outputs.perf_shards }}
      perf_total: ${{ steps.plan.outputs.perf_total }}
      lighthouse: ${{ steps.plan.outputs.lighthouse }}
      lighthouse_urls: ${{ steps.plan.outputs.lighthouse_urls }}
      source_run: ${{ steps.plan.outputs.source_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Cone mode keeps the root files (package.json, lighthouserc.json); src and content for the import
          # closures (pages import content JSON), e2e for the durations and the smoke test lines.
          sparse-checkout: |
            src
            content
            scripts
            e2e
      # No install: scripts/ci-plan.ts imports only node builtins and other dependency-free scripts.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          COMPLEMENT_PR: ${{ inputs.complement_pr }}
        run: bun scripts/ci-plan.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          # What this run covers; a push to main reads its merged PR run's record (scripts/ci-complement.ts).
          name: ci-plan
          path: ci-plan.json
          retention-days: 30
          if-no-files-found: warn

  check:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only for the Ask the HQ staleness comment below.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the staleness check can date content/site-content.json.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - name: Dependency audit (non-blocking)
        continue-on-error: true
        run: bun audit --audit-level=high
      - name: Ask the HQ staleness (non-blocking)
        id: staleness
        continue-on-error: true
        run: bun scripts/ask-staleness.ts --report ask-staleness.md
      - name: Comment stale Ask data on the PR
        # Skipped on forks (read-only token). One comment per PR, refreshed in place.
        if: github.event_name == 'pull_request' && steps.staleness.outputs.stale == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- ask-staleness -->")) | .id' | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@ask-staleness.md > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@ask-staleness.md > /dev/null
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks
        # gitleaks-action v3.0.0. Free for personal accounts; false positives are allowlisted in .github/gitleaks.toml.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .github/gitleaks.toml
          GITLEAKS_VERSION: 8.30.1
          # No PR comments, so the job needs no write permission.
          GITLEAKS_ENABLE_COMMENTS: "false"

  site:
    name: Build static export
    runs-on: ubuntu-latest
    # Runs next to `check`, not after it: the e2e shards only need the build. No browser here:
    # the CV is a committed PDF (public/cv/), not printed from the site.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the build facts snapshot counts commits and PRs.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Build facts snapshot
        # Rewrites content/generated/build-facts.json from git, the test files, the e2e list and ci.yml for /build.
        run: bun scripts/build-facts.ts --write
      - name: Set site URL
        # Only export NEXT_PUBLIC_SITE_URL when the variable is set, so the
        # default in src/lib/site.ts applies otherwise.
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$SITE_URL" ]; then
            echo "NEXT_PUBLIC_SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'content/**', 'messages/**', 'public/**', 'next.config.ts') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      - name: Build static export
        run: bun run build
      - name: Script policy check of out/
        run: bun scripts/scan-export.ts out
      - name: Social cards (og:check)
        run: bun run og:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: out/
          retention-days: 7

  e2e:
    name: E2E shard ${{ matrix.shard }}/${{ needs.changes.outputs.e2e_total }}
    runs-on: ubuntu-latest
    # No job-level `if:` (smart CI): a skipped matrix job reports an unexpanded check name, so the
    # steps skip instead and "Not needed" passes.
    needs: [site, changes]
    strategy:
      fail-fast: false
      matrix:
        # Sized by the plan: 8 for a full run, 1 to 8 for the affected specs of a pull request.
        shard: ${{ fromJSON(needs.changes.outputs.e2e_shards) }}
    steps:
      - name: Not needed
        if: needs.changes.outputs.e2e == 'none'
        run: |
          echo "Smart CI: no e2e specs cover this change (see Plan CI)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.e2e != 'none'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: needs.changes.outputs.e2e != 'none'
        with:
          playwright: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.e2e != 'none'
        with:
          name: site
          path: out
      - name: Playwright e2e (shard ${{ matrix.shard }}/${{ needs.changes.outputs.e2e_total }})
        # Duration-balanced test list (scripts/e2e-shard.ts, e2e/durations.json); keep the total in sync
        # e2e/deploy.spec.ts repeats the out/ scan with the private list.
        # E2E_FILES: the planned spec files and `file:line` smoke tests of a selective run; empty means every spec.
        # NIGHTLY: the nightly-only tests (`@nightly` in the title, docs/agents/performance.md) run on the
        # nightly schedule and on a dispatch with the `nightly` input; pull requests and pushes to main skip them.
        if: needs.changes.outputs.e2e != 'none'
        env:
          E2E_FILES: ${{ needs.changes.outputs.e2e_files }}
          SHARD: ${{ matrix.shard }}/${{ needs.changes.outputs.e2e_total }}
          NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly == true }}
        run: |
          skip=(--grep-invert @nightly)
          if [ "$NIGHTLY" = "true" ]; then skip=(); fi
          # shellcheck disable=SC2086 # E2E_FILES splits into one argument per spec file on purpose.
          bun run e2e:shard "$SHARD" $E2E_FILES "${skip[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && needs.changes.outputs.e2e != 'none' }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3
          # A selective run can leave a shard with no tests and so no blob report.
          if-no-files-found: ignore

  perf:
    # Deterministic 3D gates (appendix 08 section 2, e2e/perf/): 3D bytes after the gate, settled draw
    # calls and shader programs per floor on both tiers, peaks in the intro, rides and hover, and memory
    # after round trips on the full tier with Motion Full (the lite, reduced-motion memory gate,
    # e2e/memory.spec.ts, runs in the e2e shards). Counters and bytes only; time-based numbers are never
    # gated here.
    name: 3D perf gates ${{ matrix.shard }}/${{ needs.changes.outputs.perf_total }}
    runs-on: ubuntu-latest
    # No job-level `if:` (smart CI), as in the e2e job: the required checks "3D perf gates 1/2" and
    # "2/2" need the expanded matrix names, so pull requests always plan 2 perf shards (4 elsewhere).
    needs: [site, changes]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.perf_shards) }}
    steps:
      - name: Not needed
        if: needs.changes.outputs.perf == 'false'
        run: |
          echo "Smart CI: this change cannot move the 3D perf gates (see Plan CI)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.perf != 'false'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: needs.changes.outputs.perf != 'false'
        with:
          playwright: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.perf != 'false'
        with:
          name: site
          path: out
      - name: 3D perf gates (shard ${{ matrix.shard }}/${{ needs.changes.outputs.perf_total }})
        # Same duration-balanced split as the e2e shards (perf lane timings in e2e/durations.json), not
        # Playwright's contiguous --shard, which put all four slow full-tier floors into shard 1.
        # PERF_GREP: the affected perf tests of a pull request (scripts/perf-plan.ts); empty runs the lane.
        if: needs.changes.outputs.perf != 'false'
        env:
          PERF_GREP: ${{ needs.changes.outputs.perf_grep }}
          SHARD: ${{ matrix.shard }}/${{ needs.changes.outputs.perf_total }}
        run: |
          if [ -n "$PERF_GREP" ]; then
            bun run e2e:perf:shard "$SHARD" --grep "$PERF_GREP"
          else
            bun run e2e:perf:shard "$SHARD"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && needs.changes.outputs.perf != 'false' }}
        with:
          name: perf-report-${{ matrix.shard }}
          path: perf-report/
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() && needs.changes.outputs.perf != 'false' }}
        with:
          name: perf-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  build:
    # Keeps the historical name (from when the build printed the CV) so branch rules and status
    # checks keep working.
    name: Build, CV and e2e
    runs-on: ubuntu-latest
    needs: [changes, check, secrets, site, e2e, lighthouse, perf]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      # Downloads the last green main run's perf-report for the summary deltas.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge e2e reports
        env:
          # The JSON copy feeds the flaky summary below.
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
          E2E_PLAN: ${{ needs.changes.outputs.e2e }}
        run: |
          if compgen -G "all-blob-reports/*.zip" > /dev/null; then
            bunx playwright merge-reports --reporter html,json ./all-blob-reports
          elif [ "$E2E_PLAN" = "none" ]; then
            echo "Smart CI: no e2e shard ran, nothing to merge."
          else
            echo "::warning::No e2e blob reports to merge."
          fi
      - name: Flaky tests (job summary)
        # Tests that failed once and passed on the retry: listed with a warning, never a failure. Without
        # e2e-results.json (no shard ran) it prints a notice and passes.
        if: ${{ !cancelled() }}
        run: bun scripts/flaky-report.ts e2e-results.json --lane "E2E"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: The PR run's perf report (complement run)
        # A complement run measured only the tests the PR run did not: add the PR run's measurements, so
        # main's perf-report stays a full baseline for the next pull request.
        if: needs.changes.outputs.source_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ needs.changes.outputs.source_run }}
        run: |
          if gh run download "$RUN" --repo "$REPO" --name perf-report --dir perf-report; then
            echo "Merged the perf report of CI run $RUN."
          else
            echo "::notice::CI run $RUN has no perf-report artifact (it ran no perf gate)."
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.perf != 'false'
        with:
          pattern: perf-report-*
          path: perf-report
          merge-multiple: true
      - name: Main baseline for the 3D perf summary
        if: needs.changes.outputs.perf != 'false' || needs.changes.outputs.source_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/perf-base.sh perf-report base-perf ci.yml push
      - name: 3D perf summary
        if: needs.changes.outputs.perf != 'false' || needs.changes.outputs.source_run != ''
        run: bun scripts/perf-summary.ts gates --head perf-report --base base-perf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.perf != 'false' || needs.changes.outputs.source_run != ''
        with:
          # The next run's baseline when this run is on main.
          name: perf-report
          path: perf-report/
          retention-days: 30
          if-no-files-found: ignore
      - name: Mark a complete run (deploy gate)
        # scripts/ci-status.ts reuses only CI runs that ran every e2e test, every perf test and every Lighthouse URL.
        if: needs.changes.outputs.full == 'true'
        env:
          SHA: ${{ github.sha }}
          SOURCE_RUN: ${{ needs.changes.outputs.source_run }}
        run: |
          echo "$SHA" > ci-full.txt
          if [ -n "$SOURCE_RUN" ]; then echo "complement of CI run $SOURCE_RUN" >> ci-full.txt; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.full == 'true'
        with:
          name: ci-full
          path: ci-full.txt
          retention-days: 30
          overwrite: true
      - name: Require every job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes, check, secrets, site, e2e, lighthouse, perf: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job did not succeed ($RESULTS)."
              exit 1
            fi
          done

  lighthouse:
    # Blocking: the error-level budgets in lighthouserc.json (LCP, CLS, TBT as the median of 3 runs;
    # font, document, CSS and JS transfer bytes) fail this job and, through the aggregate job, the
    # required check.
    name: Lighthouse CI
    runs-on: ubuntu-latest
    # No job-level `if:` (smart CI): the steps skip and "Not needed" passes the required check.
    needs: [site, changes]
    permissions:
      contents: read
      # Downloads the last green main run's Lighthouse reports for the per-chunk diff.
      actions: read
    steps:
      - name: Not needed
        if: needs.changes.outputs.lighthouse == 'false'
        run: |
          echo "Smart CI: this change cannot move the Classic site budgets (see Plan CI)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.lighthouse != 'false'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.lighthouse != 'false'
        with:
          name: site
          path: out
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.changes.outputs.lighthouse != 'false'
        with:
          bun-version-file: package.json
      # bunx runs @lhci/cli on Node (its bin has a node shebang): the pinned Node, not the runner's.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.lighthouse != 'false'
        with:
          node-version-file: .nvmrc
      - name: Run Lighthouse CI
        # Uses the preinstalled Google Chrome and lighthouserc.json. LHCI_URLS: the affected URLs of a pull
        # request (warm-up first, scripts/ci-plan.ts); empty runs every URL in lighthouserc.json.
        if: needs.changes.outputs.lighthouse != 'false'
        env:
          LHCI_URLS: ${{ needs.changes.outputs.lighthouse_urls }}
        run: |
          if [ -n "$LHCI_URLS" ]; then
            jq --argjson urls "$LHCI_URLS" '.ci.collect.url = $urls' lighthouserc.json > lighthouserc.pr.json
            bunx @lhci/cli@0.15.1 autorun --config=lighthouserc.pr.json
          else
            bunx @lhci/cli@0.15.1 autorun
          fi
      - name: The PR run's reports (complement run)
        # A complement run measured only the URLs the PR run did not: add the PR run's reports, so main's
        # lighthouse-reports stay a full baseline for the next pull request (cp -n keeps this run's files).
        if: ${{ !cancelled() && needs.changes.outputs.source_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ needs.changes.outputs.source_run }}
        run: |
          mkdir -p .lighthouseci
          if gh run download "$RUN" --repo "$REPO" --name lighthouse-reports --dir source-lhci; then
            find source-lhci -maxdepth 1 -name 'lhr-*' -exec cp -n {} .lighthouseci/ \;
            echo "Merged the Lighthouse reports of CI run $RUN."
          else
            echo "::notice::CI run $RUN has no lighthouse-reports artifact; the baseline covers only this run's URLs."
          fi
      - name: Main baseline for the JS chunk diff
        if: ${{ !cancelled() && needs.changes.outputs.lighthouse != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/perf-base.sh lighthouse-reports base-lhci ci.yml push
      - name: Page View JS per chunk (job summary)
        if: ${{ !cancelled() && needs.changes.outputs.lighthouse != 'false' }}
        run: bun scripts/perf-summary.ts lhci --head .lighthouseci --base base-lhci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && (needs.changes.outputs.lighthouse != 'false' || needs.changes.outputs.source_run != '') }}
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14

  nightly:
    # Nightly only: one `ci-nightly` issue opened on a failing night, updated while it keeps failing and
    # closed by the next green nightly (scripts/ci-nightly.ts). APPLY is true only on main; a dispatch
    # with `nightly` on another branch is a dry run that prints the action.
    name: Nightly report
    needs: [changes, check, secrets, site, e2e, perf, lighthouse, build]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.nightly) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      # No install: scripts/ci-nightly.ts uses fetch only.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Open, update or close the ci-nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          APPLY: ${{ github.ref == 'refs/heads/main' }}
        run: bun scripts/ci-nightly.ts

  preview:
    name: Cloudflare Pages preview
    runs-on: ubuntu-latest
    needs: site
    # Preview only, and opt-in: set the repository variable CF_PREVIEWS=true to turn it on. The
    # CLOUDFLARE_API_TOKEN secret exists for deploy.yml, so the variable keeps previews off by default.
    # Once the Cloudflare secrets live only in the main-only `production` environment (S3), PR jobs
    # cannot read them: previews then need their own preview-only token (Pages Edit on the preview
    # project) as a repository secret.
    # Production deploys run from .github/workflows/deploy.yml.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.CF_PREVIEWS == 'true'
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Optional repository variable; defaults to the dedicated preview project.
      CF_PAGES_PROJECT: ${{ vars.CF_PREVIEW_PROJECT || 'shinyq-hq' }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the preview deploy."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.enabled == 'true'
        with:
          persist-credentials: false
      # wrangler from the lockfile (devDependency, exact version; S4).
      - uses: ./.github/actions/setup
        if: steps.secrets.outputs.enabled == 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.secrets.outputs.enabled == 'true'
        with:
          name: site
          path: out
      - name: Ensure the preview project exists
        if: steps.secrets.outputs.enabled == 'true'
        # Production branch is a branch we never push, so every deploy stays a preview.
        run: bunx wrangler pages project create "$CF_PAGES_PROJECT" --production-branch=production-cutover-phase-6 || true
      - name: Deploy preview
        id: deploy
        if: steps.secrets.outputs.enabled == 'true'
        run: |
          BRANCH="pr-${{ github.event.pull_request.number }}"
          bunx wrangler pages deploy out --project-name="$CF_PAGES_PROJECT" --branch="$BRANCH" --commit-dirty=true | tee deploy.log
          URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -n1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: steps.secrets.outputs.enabled == 'true'
        run: echo "Preview deployed to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
