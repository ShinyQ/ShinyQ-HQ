name: CI

# PR pipeline: build once, run e2e in 4 parallel shards against the same `out/`, then merge the
# reports. "Build, CV and e2e" is the aggregate job: it fails if any job before it failed, so it
# stays the single required check. Screenshots run in screenshots.yml (nightly, label, manual).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Private public-safety blocklist (internal codenames, private repo names).
  # Optional: when unset, only the committed default list is enforced.
  SAFETY_BLOCKLIST: ${{ secrets.SAFETY_BLOCKLIST }}
  NEXT_TELEMETRY_DISABLED: "1"
  # Cloudflare Web Analytics token; the beacon is omitted when empty.
  NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}

jobs:
  check:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  site:
    name: Build static export
    runs-on: ubuntu-latest
    # Runs next to `check`, not after it: the e2e shards only need the build. No browser here:
    # the CV is a committed PDF (public/cv/), not printed from the site.
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Set site URL
        # Only export NEXT_PUBLIC_SITE_URL when the variable is set, so the
        # default in src/lib/site.ts applies otherwise.
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$SITE_URL" ]; then
            echo "NEXT_PUBLIC_SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
          fi
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'content/**', 'messages/**', 'public/**', 'next.config.ts') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      - name: Build static export
        run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: out/
          retention-days: 7

  e2e:
    name: E2E shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    needs: site
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          playwright: "true"
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: out
      - name: Playwright e2e (shard ${{ matrix.shard }}/4)
        # Round-robin test list (scripts/e2e-shard.ts); keep the total in sync with the matrix.
        run: bun run e2e:shard ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3

  build:
    # Keeps the historical name (from when the build printed the CV) so branch rules and status
    # checks keep working.
    name: Build, CV and e2e
    runs-on: ubuntu-latest
    needs: [check, site, e2e]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge e2e reports
        run: |
          if compgen -G "all-blob-reports/*.zip" > /dev/null; then
            bunx playwright merge-reports --reporter html ./all-blob-reports
          else
            echo "::warning::No e2e blob reports to merge."
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Require every job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "check, site, e2e: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job did not succeed ($RESULTS)."
              exit 1
            fi
          done

  lighthouse:
    name: Lighthouse CI (non-blocking)
    runs-on: ubuntu-latest
    needs: site
    # Reports only for now. Remove continue-on-error to make the budgets blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: out
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Run Lighthouse CI
        # Uses the preinstalled Google Chrome and lighthouserc.json.
        run: bunx @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14

  preview:
    name: Cloudflare Pages preview
    runs-on: ubuntu-latest
    needs: site
    # Preview only. Production deploys run from .github/workflows/deploy.yml.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Optional repository variable; defaults to the dedicated preview project.
      CF_PAGES_PROJECT: ${{ vars.CF_PREVIEW_PROJECT || 'shinyq-hq' }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the preview deploy."
          fi
      - uses: actions/download-artifact@v8
        if: steps.secrets.outputs.enabled == 'true'
        with:
          name: site
          path: out
      - uses: oven-sh/setup-bun@v2
        if: steps.secrets.outputs.enabled == 'true'
      - name: Ensure the preview project exists
        if: steps.secrets.outputs.enabled == 'true'
        # Production branch is a branch we never push, so every deploy stays a preview.
        run: bunx wrangler@3 pages project create "$CF_PAGES_PROJECT" --production-branch=production-cutover-phase-6 || true
      - name: Deploy preview
        id: deploy
        if: steps.secrets.outputs.enabled == 'true'
        run: |
          BRANCH="pr-${{ github.event.pull_request.number }}"
          bunx wrangler@3 pages deploy out --project-name="$CF_PAGES_PROJECT" --branch="$BRANCH" --commit-dirty=true | tee deploy.log
          URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -n1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: steps.secrets.outputs.enabled == 'true'
        run: echo "Preview deployed to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
